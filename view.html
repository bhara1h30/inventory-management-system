<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>View Products</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f1f5f9;
    }

    .sidebar {
      width: 220px;
      height: 100vh;
      background: #1e293b;
      color: white;
      position: fixed;
      padding-top: 20px;
    }

    .sidebar h2 {
      text-align: center;
      margin-bottom: 30px;
    }

    .sidebar a {
      display: block;
      color: white;
      padding: 15px 20px;
      text-decoration: none;
    }

    .sidebar a:hover {
      background: #334155;
    }

    .main {
      margin-left: 220px;
      padding: 20px;
    }

    table {
      width: 100%;
      background: white;
      border-collapse: collapse;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 0 5px rgba(0,0,0,0.1);
    }

    th, td {
      padding: 12px;
      text-align: center;
      border-bottom: 1px solid #e5e7eb;
    }

    th {
      background: #1e293b;
      color: white;
    }

    img {
      width: 60px;
      height: 60px;
      object-fit: cover;
      border-radius: 6px;
    }

    .btn {
      padding: 6px 10px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      color: white;
    }

    .edit {
      background: #3b82f6;
    }

    .delete {
      background: #ef4444;
    }

    .logout {
      background: red;
      color: white;
      border: none;
      padding: 8px 12px;
      border-radius: 5px;
      cursor: pointer;
    }

    .modal {
      display: none;
      position: fixed;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.5);
      justify-content: center;
      align-items: center;
    }

    .modal-content {
      background: white;
      padding: 20px;
      border-radius: 10px;
      width: 300px;
    }

    .modal-content input {
      width: 90%;
      padding: 8px;
      margin: 5px 0;
    }

    .modal-content button {
      margin-top: 10px;
      padding: 8px 12px;
      background: #1e293b;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="sidebar">
    <h2>Inventory</h2>
    <a href="index.html">Dashboard</a>
    <a href="add.html">Add Product</a>
    <a href="view.html">View Products</a>
    <a href="about.html">About</a>
    <a href="#" onclick="logout()">Logout</a>
  </div>

  <div class="main">
    <h1>View Products</h1>
    <table>
      <thead>
        <tr>
          <th>Image</th>
          <th>Name</th>
          <th>Category</th>
          <th>Qty</th>
          <th>Price</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="productTable"></tbody>
    </table>
  </div>

  <!-- Edit Modal -->
  <div class="modal" id="editModal">
    <div class="modal-content">
      <h3>Edit Product</h3>
      <input type="text" id="editName" placeholder="Name">
      <input type="text" id="editCategory" placeholder="Category">
      <input type="number" id="editQty" placeholder="Quantity">
      <input type="number" id="editPrice" placeholder="Price">
      <input type="text" id="editImage" placeholder="Image URL">
      <button onclick="saveEdit()">Save</button>
      <button onclick="closeModal()">Cancel</button>
    </div>
  </div>

  <script>
    // Login check
    if (localStorage.getItem("loggedIn") !== "true") {
      window.location.href = "login.html";
    }

    function logout() {
      localStorage.removeItem("loggedIn");
      window.location.href = "login.html";
    }

    let products = JSON.parse(localStorage.getItem("products")) || [];
    let editIndex = null;

    function loadTable() {
      let table = document.getElementById("productTable");
      table.innerHTML = "";

      products.forEach((p, index) => {
        let row = `
          <tr>
            <td><img src="${p.image || 'https://via.placeholder.com/60'}"></td>
            <td>${p.name}</td>
            <td>${p.category}</td>
            <td>${p.quantity}</td>
            <td>₹${p.price}</td>
            <td>
              <button class="btn edit" onclick="editProduct(${index})">Edit</button>
              <button class="btn delete" onclick="deleteProduct(${index})">Delete</button>
            </td>
          </tr>
        `;
        table.innerHTML += row;
      });
    }

    function deleteProduct(index) {
      if (confirm("Are you sure you want to delete this product?")) {
        products.splice(index, 1);
        localStorage.setItem("products", JSON.stringify(products));
        loadTable();
      }
    }

    function editProduct(index) {
      editIndex = index;
      let p = products[index];

      document.getElementById("editName").value = p.name;
      document.getElementById("editCategory").value = p.category;
      document.getElementById("editQty").value = p.quantity;
      document.getElementById("editPrice").value = p.price;
      document.getElementById("editImage").value = p.image;

      document.getElementById("editModal").style.display = "flex";
    }

    function closeModal() {
      document.getElementById("editModal").style.display = "none";
    }

    function saveEdit() {
      products[editIndex] = {
        name: editName.value,
        category: editCategory.value,
        quantity: editQty.value,
        price: editPrice.value,
        image: editImage.value
      };

      localStorage.setItem("products", JSON.stringify(products));
      closeModal();
      loadTable();
    }

    loadTable();
  </script>

</body>
</html>
